name: ryo-morimoto-global-agents
version: 1.0.0
targets:
  - claude
  - agent-skills
dependencies:
  apm: []
  mcp:
    - name: context7
      transport: http
      registry: false
      url: https://mcp.context7.com/mcp
    - name: linear
      transport: http
      registry: false
      url: https://mcp.linear.app/mcp
    - name: exa
      transport: stdio
      registry: false
      command: npx
      args:
        - -y
        - exa-mcp-server
    - name: penpot
      transport: stdio
      registry: false
      command: npx
      args:
        - -y
        - mcp-remote
        - http://localhost:4401/mcp
        - --allow-http
