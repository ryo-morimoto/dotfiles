[settings]
experimental = true
lockfile = true
minimum_release_age = "24h"

[tools]
aqua = "latest"
herdr = "latest"
portless = "latest"
"pipx:apm-cli" = "latest"
"npm:agent-browser" = "latest"
"npm:@xai-official/grok" = "latest"
"npm:@tobilu/qmd" = { version = "latest", npm_args = "--ignore-scripts=false" }

[tools."github:justrach/codedb"]
version = "latest"
asset_pattern = "codedb-linux-x86_64"
bin = "codedb"

[tools."github:agentika-labs/grepika"]
version = "latest"
asset_pattern = "grepika-x86_64-unknown-linux-gnu.tar.gz"
rename_exe = "grepika"

[tools."github:k1LoW/mo"]
version = "latest"
asset_pattern = "mo_v*_linux_amd64.tar.gz"
rename_exe = "mo"

[tools."github:mizchi/starlint"]
version = "latest"
asset_pattern = "starlint-linux-x64.tar.gz"
rename_exe = "starlint"

[tools."http:coderabbit"]
version = "latest"
url = "https://cli.coderabbit.ai/releases/{{ version }}/coderabbit-linux-x64.zip"
version_list_url = "https://cli.coderabbit.ai/releases/latest/VERSION"
rename_exe = "coderabbit"

[tools."github:zed-industries/zed"]
version = "latest"
asset_pattern = "zed-linux-x86_64.tar.gz"
bin_path = "zed.app/bin"
filter_bins = "zed"

[tasks.install-cursor-agent]
description = "Install Cursor Agent CLI outside Nix"
run = "curl https://cursor.com/install -fsS | bash"

[tasks.install-herdr-integrations]
description = "Install Herdr integrations for backend agent CLIs"
run = """
herdr integration install codex
herdr integration install claude
herdr integration status
"""
