name: Update mise.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * 0" # 04:30 JST every Monday

concurrency:
  group: update-mise-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.7.15
          install: false
          cache: false
          experimental: true
      - id: update
        name: Resolve latest mise tools
        run: |
          mkdir -p "$HOME/.config/mise"
          cp dot-config/config/mise/config.toml "$HOME/.config/mise/config.toml"
          mise lock --global --platform linux-x64 --yes
          mise install --yes "http:coderabbit@latest"

          if cmp -s "$HOME/.config/mise/mise.lock" dot-config/config/mise/mise.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$HOME/.config/mise/mise.lock" dot-config/config/mise/mise.lock
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: pull-request
        name: Create or refresh pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/update-mise-lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add dot-config/config/mise/mise.lock
          git commit -m "chore: update mise.lock"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease="refs/heads/$branch" origin "HEAD:$branch"

          pull_request_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [[ -z "$pull_request_number" ]]; then
            pull_request_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update mise.lock" \
              --label dependencies \
              --body "Resolve mise-managed tools to the latest versions eligible under the configured release-age policy.")"
            pull_request_number="$(gh pr view "$pull_request_url" --json number --jq .number)"
          fi
          echo "number=$pull_request_number" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        if: steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --rebase "${{ steps.pull-request.outputs.number }}"
